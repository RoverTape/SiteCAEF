name: Keep Supabase Awake

# Mantém o projeto Supabase do free tier ativo, evitando o pause
# após 7 dias sem atividade. Faz uma leitura leve 2x por semana.
#
# Setup:
# 1. Em Settings → Secrets and variables → Actions do GitHub, criar:
#      SUPABASE_URL       = https://SEU-PROJECT-ID.supabase.co
#      SUPABASE_ANON_KEY  = sua anon key (pública, sem problema)
# 2. Em Settings → Actions → General, marcar "Allow all actions".
# 3. Pode rodar manualmente pelo botão "Run workflow" pra testar.

on:
  schedule:
    # Segunda e quinta às 12:00 UTC (09:00 BRT)
    - cron: '0 12 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ler 1 linha do banco (mantém ativo)
        run: |
          # Limit=1 garante request mínima. Usa 'membros', que existe
          # de fato no schema e tem policy de leitura pública.
          HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/membros?select=nome&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP: $HTTP"
          cat /tmp/resp.json
          if [ "$HTTP" -ge 400 ]; then
            echo "::error::Ping falhou (HTTP $HTTP)"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
